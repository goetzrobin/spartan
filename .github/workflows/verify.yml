name: verify

# Runs the Playwright tests for the components a change can affect and attaches the proof: a video
# and final screenshot of every test and the accessibility results.
#

on:
  pull_request: {}
  # Lets this workflow gate a merge queue once one is switched on for the repo.
  merge_group: {}
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=6000

jobs:
  affected:
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.pick.outputs.components }}
      pages: ${{ steps.pick.outputs.pages }}
      shards: ${{ steps.pick.outputs.shards }}
      total: ${{ steps.pick.outputs.total }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Pick the affected components
        id: pick
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          BASE="${PR_BASE:-${QUEUE_BASE:-$PUSH_BASE}}"
          # A first push to a branch has no previous commit to compare with.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=origin/main; fi
          # The selection only reads files and follows imports, so it needs no install.
          node tools/verify/verify.mjs --affected --list --base "$BASE" | tee affected.json
          COMPONENTS=$(node -p "JSON.parse(require('fs').readFileSync('affected.json','utf8')).components.join(' ')")
          PAGES=$(node -p "JSON.parse(require('fs').readFileSync('affected.json','utf8')).pages.join(',')")
          echo "components=$COMPONENTS" >> "$GITHUB_OUTPUT"
          echo "pages=$PAGES" >> "$GITHUB_OUTPUT"
          echo "any=$([ -n "$COMPONENTS$PAGES" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          COUNT=$(node -p "JSON.parse(require('fs').readFileSync('affected.json','utf8')).pageCount")
          if [ "$COUNT" -le 40 ]; then TOTAL=1; elif [ "$COUNT" -le 120 ]; then TOTAL=2; else TOTAL=4; fi
          echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "shards=$(node -p "JSON.stringify(Array.from({ length: $TOTAL }, (_, i) => i + 1))")" >> "$GITHUB_OUTPUT"
          echo "$COUNT test pages selected, $TOTAL test machine(s)"

  build:
    needs: affected
    if: ${{ needs.affected.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Restore a build of the same sources
        id: cache
        uses: actions/cache@v5
        with:
          path: dist/apps/app/client
          key: test-app-${{ runner.os }}-${{ hashFiles('libs/**', 'apps/app/**', 'pnpm-lock.yaml', 'package.json', 'tsconfig.base.json', 'nx.json', '.node-version') }}
      - uses: ./.github/actions/setup
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Build the test pages
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          VERIFY_BUILD: '1'
        run: pnpm nx build app --skip-nx-cache
      - name: Upload the build
        uses: actions/upload-artifact@v5
        with:
          name: test-app
          path: dist/apps/app/client
          retention-days: 1

  test:
    needs: [affected, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.affected.outputs.shards) }}
    name: test (${{ matrix.shard }}/${{ needs.affected.outputs.total }})
    env:
      COMPONENTS: ${{ needs.affected.outputs.components }}
      PAGES: ${{ needs.affected.outputs.pages }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium ffmpeg
      - name: Download the build
        uses: actions/download-artifact@v5
        with:
          name: test-app
          path: dist/apps/app/client
      - name: Verify
        run: pnpm verify $COMPONENTS ${PAGES:+--pages $PAGES} --prebuilt -- --shard=${{ matrix.shard }}/${{ needs.affected.outputs.total }}
      - name: Name the results after the shard
        if: ${{ !cancelled() }}
        run: mv dist/.playwright/ui-e2e/results.json dist/.playwright/ui-e2e/results-${{ matrix.shard }}.json
      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: results-${{ matrix.shard }}
          path: |
            dist/.playwright/ui-e2e/results-${{ matrix.shard }}.json
            dist/.playwright/ui-e2e/output
          retention-days: 7

  proof:
    needs: [affected, test]
    if: ${{ !cancelled() && needs.affected.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
      BASE_BRANCH: ${{ github.base_ref || github.ref_name }}
      TESTS_PASSED: ${{ needs.test.result == 'success' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Download the results of every shard
        uses: actions/download-artifact@v5
        with:
          pattern: results-*
          merge-multiple: true
          path: dist/.playwright/ui-e2e
      - name: Fetch the reference screenshots
        run: |
          mkdir -p proof/baseline proof/own
          fetch() {
            git fetch --quiet --depth=1 origin "refs/heads/ci-proof/baseline/$1" 2>/dev/null || return 1
            git archive FETCH_HEAD | tar -x -C "$2"
          }
          fetch "$BASE_BRANCH" proof/baseline || fetch main proof/baseline || echo "No reference screenshots for $BASE_BRANCH or main"
          fetch "$HEAD_BRANCH" proof/own || cp -r proof/baseline/. proof/own/
      - name: Build the proof
        run: |
          RESULTS=$(ls dist/.playwright/ui-e2e/results-*.json | paste -sd, -)
          node tools/verify/proof.mjs --results "$RESULTS"
          decide() {
            node tools/verify/decision.mjs --results "$RESULTS" --baseline-dir proof/baseline \
              --save-screenshots proof/own --changed-dir proof/changed --image-base __IMAGES__ \
              --base-name "$BASE_BRANCH" --pages-file apps/ui-e2e/test-pages.json --out comment.md \
              --need-converter proof/need-converter
          }
          decide
          if [ -e proof/need-converter ]; then
            sudo apt-get install -y --no-install-recommends ffmpeg > /dev/null
            decide
          fi
      - name: Upload the proof
        id: upload
        uses: actions/upload-artifact@v5
        with:
          name: verification-proof
          path: dist/.playwright/ui-e2e/proof
          retention-days: 14
      - name: Publish the proof pages
        id: images
        if: ${{ env.SAME_REPO == 'true' && github.event_name == 'pull_request' }}
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          cd proof/changed
          git init --quiet
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit --quiet -m "ci: screenshots for pull request $PR"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/ci-proof/pr-$PR"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Save the reference screenshots for this branch
        if: ${{ env.SAME_REPO == 'true' && env.TESTS_PASSED == 'true' && github.event_name != 'merge_group' }}
        run: |
          cd proof/own
          git init --quiet
          git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit --quiet -m "ci: reference screenshots for $HEAD_BRANCH at ${GITHUB_SHA::7}"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/ci-proof/baseline/$HEAD_BRANCH"
      - name: Write the decision
        env:
          IMAGES_SHA: ${{ steps.images.outputs.sha }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          sed -i "s#__IMAGES__#https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$IMAGES_SHA#g" comment.md
          if [ -n "$IMAGES_SHA" ]; then
            printf '\n[Every test with its screenshot](https://github.com/%s/tree/%s#readme) · [videos (download)](%s) · commit %s\n' \
              "$GITHUB_REPOSITORY" "$IMAGES_SHA" "$ARTIFACT_URL" "${GITHUB_SHA::7}" >> comment.md
          else
            printf '\n[Videos and full results (download)](%s) · commit %s\n' "$ARTIFACT_URL" "${GITHUB_SHA::7}" >> comment.md
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && env.SAME_REPO == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          EXISTING=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- verification-proof -->")) | .id][0] // empty')
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$EXISTING" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi

  # One stable check to mark as required: green when the affected components pass, and also
  # green when a change affects no component at all.
  verified:
    needs: [affected, build, test]
    if: ${{ always() && (github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the result
        env:
          AFFECTED: ${{ needs.affected.result }}
          BUILD: ${{ needs.build.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "affected: $AFFECTED, build: $BUILD, test: $TEST"
          [ "$AFFECTED" = "success" ] || exit 1
          [ "$BUILD" = "success" ] || [ "$BUILD" = "skipped" ] || exit 1
          [ "$TEST" = "success" ] || [ "$TEST" = "skipped" ] || exit 1
